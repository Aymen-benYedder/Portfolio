<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B0E14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131A26"/>
      <stop offset="100%" stop-color="#0E1420"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#10B981" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="630" fill="#0B0E14"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- CIRCUIT TRACES (panel -> gate -> reviewer) -->
  <g stroke="#10B981" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M 130 315 H 410"/>
    <path d="M 410 295 H 620 V 255 H 700"/>
    <path d="M 620 335 H 700"/>
    <path d="M 870 300 V 315"/>
    <path d="M 870 330 V 345"/>
  </g>

  <!-- AI SOURCE PANEL (left) -->
  <g transform="rotate(-3 200 315)">
    <rect x="60" y="150" width="280" height="330" rx="16" fill="url(#panelGrad)" stroke="#1F2937" stroke-width="1.5"/>
    <rect x="80" y="175" width="70" height="8" rx="4" fill="#10B981" fill-opacity="0.8"/>
    <rect x="80" y="198" width="110" height="5" rx="2.5" fill="#374151"/>
    <circle cx="200" cy="260" r="34" fill="#10B981" fill-opacity="0.10"/>
    <circle cx="200" cy="260" r="17" fill="#10B981" fill-opacity="0.9" filter="url(#smallGlow)"/>
    <circle cx="200" cy="260" r="6" fill="#D1FAE5"/>
    <!-- code lines in panel -->
    <rect x="80" y="330" width="120" height="4" rx="2" fill="#374151"/>
    <rect x="80" y="348" width="90" height="4" rx="2" fill="#374151"/>
    <rect x="80" y="366" width="140" height="4" rx="2" fill="#374151"/>
    <rect x="80" y="384" width="60" height="4" rx="2" fill="#10B981" fill-opacity="0.35"/>
  </g>

  <!-- CODE PARTICLES flowing right from panel -->
  <g fill="#10B981">
    <circle cx="370" cy="280" r="4" fill-opacity="0.9" filter="url(#smallGlow)"/>
    <circle cx="410" cy="300" r="3" fill-opacity="0.6"/>
    <circle cx="450" cy="260" r="2.5" fill-opacity="0.5"/>
    <circle cx="490" cy="285" r="3.5" fill-opacity="0.7"/>
    <circle cx="530" cy="255" r="2" fill-opacity="0.4"/>
    <circle cx="565" cy="305" r="4" fill-opacity="0.85" filter="url(#smallGlow)"/>
  </g>

  <!-- VERIFICATION GATE (center) -->
  <g>
    <rect x="620" y="150" width="14" height="330" rx="7" fill="url(#beamGrad)" filter="url(#softGlow)"/>
    <rect x="806" y="150" width="14" height="330" rx="7" fill="url(#beamGrad)" filter="url(#softGlow)"/>
    <rect x="700" y="40" width="36" height="10" rx="5" fill="#10B981" fill-opacity="0.9" filter="url(#smallGlow)"/>
    <!-- scan line -->
    <rect x="602" y="300" width="236" height="3" rx="1.5" fill="#D1FAE5" fill-opacity="0.8" filter="url(#smallGlow)"/>
    <!-- passing particles -->
    <circle cx="660" cy="285" r="3.5" fill="#10B981" fill-opacity="0.9"/>
    <circle cx="730" cy="265" r="4" fill="#D1FAE5" fill-opacity="0.9" filter="url(#smallGlow)"/>
    <circle cx="770" cy="315" r="3" fill="#10B981" fill-opacity="0.7"/>
    <!-- rejected particles deflecting down (dim, angled) -->
    <g fill="#F87171" fill-opacity="0.55">
      <circle cx="665" cy="330" r="2.5"/>
      <circle cx="700" cy="395" r="2"/>
      <circle cx="745" cy="420" r="3" fill-opacity="0.4"/>
      <circle cx="790" cy="455" r="2" fill-opacity="0.35"/>
    </g>
  </g>

  <!-- REVIEWER SILHOUETTE (right) -->
  <g>
    <!-- shield emblem behind reviewer -->
    <g filter="url(#dropShadow)" transform="translate(1010 210)">
      <path d="M 0 0 L 34 0 L 34 52 C 34 64 17 74 17 74 C 17 74 0 64 0 52 Z" fill="url(#shieldGrad)" filter="url(#smallGlow)"/>
      <path d="M 9 37 L 15 44 L 27 28" fill="none" stroke="#0B0E14" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- abstract faceless reviewer: head + shoulders with emerald rim light -->
    <circle cx="1100" cy="265" r="62" fill="#0A0D12" stroke="#10B981" stroke-opacity="0.7" stroke-width="2" filter="url(#dropShadow)"/>
    <path d="M 1012 470 C 1012 382 1070 340 1100 340 C 1130 340 1188 382 1188 470 Z" fill="#0A0D12" stroke="#10B981" stroke-opacity="0.7" stroke-width="2" filter="url(#dropShadow)"/>
    <!-- reviewer scanning beams toward the gate -->
    <path d="M 1040 300 L 900 280" stroke="#10B981" stroke-opacity="0.25" stroke-width="1.5"/>
    <path d="M 1040 320 L 900 310" stroke="#10B981" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>

  <!-- BOTTOM ACCENT LINE -->
  <rect x="0" y="620" width="1200" height="10" fill="#10B981" fill-opacity="0.25"/>
</svg>
